[project]
name = "symsim"
version = "0.1.0"
description = "Symbolic simulator: trajectories over a task automaton with injected mistakes and perception noise."
requires-python = ">=3.12"
dependencies = ["contracts"]

[project.scripts]
symsim = "symsim.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
contracts = { path = "../../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symsim"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
