<!doctype html><html><head><meta charset="utf-8"><title>Run review</title><style>
body{font:13px system-ui;margin:0;background:#fafafa;color:#222}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;z-index:2}
pre{white-space:pre-wrap;margin:6px 0;max-height:30vh;overflow:auto;background:#f3f3f3;padding:6px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:3px 6px;vertical-align:top}
th{position:sticky;top:0;background:#fff;text-align:left}
tr.sel{outline:2px solid #2563eb}tr.ok td.m{background:#dcfce7}tr.bad td.m{background:#fee2e2}
td.lab b{color:#1d4ed8}img{height:84px;margin-right:2px;border-radius:3px}
.ev-step_done{color:#15803d;font-weight:600}.ev-mistake{color:#b91c1c;font-weight:600}.ev-task_done{color:#7c3aed;font-weight:600}
.keys span{display:inline-block;margin-right:10px}.dim{color:#888}
</style></head><body><header>
<select id="sess"></select> <span id="saved" class="dim"></span>
<div class="keys" id="keys"></div><pre id="report"></pre></header>
<table><thead><tr><th>call · t</th><th>frames (older, newer)</th><th>expected next</th><th>model says</th>
<th>truth (label)</th><th>supervisor (model)</th><th>supervisor (labels)</th></tr></thead><tbody id="rows"></tbody></table>
<script>
let data, sel = 0, sid;
const $ = (id) => document.getElementById(id);
async function load(post) {
  const r = await fetch(post ? '/labels' : '/data.json', post ? {method:'POST', body: JSON.stringify(post)} : {});
  data = await r.json();
  if (!sid) sid = data.sessions.reduce((a, b) => (b.calls.length > a.calls.length ? b : a)).id;
  $('sess').innerHTML = data.sessions.map((s) => `<option value="${s.id}" ${s.id===sid?'selected':''}>${s.id} · ${s.task.id} · ${s.calls.length} calls</option>`).join('');
  render();
}
const S = () => data.sessions.find((s) => s.id === sid);
function ctl(r) { if (!r) return ''; const say = r.say ? `<div class="dim">${r.say}</div>` : '';
  return r.event === 'none' && !r.say ? '' : `<span class="ev-${r.event}">${r.event}${r.step ? ' '+r.step : ''}${r.mistake ? ' ('+r.mistake+')' : ''}</span>${say}`; }
function render() {
  const s = S(); const acts = s.task.actions;
  $('keys').innerHTML = acts.map((a, i) => `<span><b>${i+1}</b> ${a}</span>`).join('') + '<span><b>0</b> none</span><span><b>⌫</b> clear</span><span><b>j/k ↑↓</b> move</span>';
  $('report').textContent = data.reports[sid];
  const t0 = s.calls[0].t_ms.at(-1);
  $('rows').innerHTML = s.calls.map((c, i) => {
    const o = c.output, truth = s.truth[i], explicit = s.labels[String(c.call)];
    const cls = truth == null ? '' : ((o.action ?? 'none') === truth ? 'ok' : 'bad');
    return `<tr data-i="${i}" class="${cls} ${i===sel?'sel':''}"><td>${c.call}<div class="dim">${((c.t_ms.at(-1)-t0)/1000).toFixed(1)}s<br>${c.latency_ms}ms</div></td>
    <td>${c.frames.map((f) => `<img src="/frames/${f}" loading="lazy">`).join('')}</td>
    <td>${c.next_steps.join(', ')}</td>
    <td class="m"><b>${o.action ?? '—'}</b> ${o.confidence} ${o.quality}<div class="dim">${o.note ?? ''}</div></td>
    <td class="lab">${explicit ? `<b>${explicit}</b>` : `<span class="dim">${truth ?? ''}</span>`}</td>
    <td>${ctl(s.model[i])}</td><td>${s.oracle ? ctl(s.oracle[i]) : ''}</td></tr>`; }).join('');
}
function move(d) { sel = Math.max(0, Math.min(S().calls.length - 1, sel + d)); render(); document.querySelector('tr.sel')?.scrollIntoView({block:'center'}); }
async function label(value) {
  const key = `${sid}:${S().calls[sel].call}`; $('saved').textContent = 'saving…';
  await load({key, value}); $('saved').textContent = 'saved to labels.json'; move(1);
}
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === '0') label('none');
  else if (/^[1-9]$/.test(e.key) && S().task.actions[+e.key-1]) label(S().task.actions[+e.key-1]);
  else if (e.key === 'Backspace') { e.preventDefault(); label(null); }
});
$('rows').addEventListener('click', (e) => { const tr = e.target.closest('tr'); if (tr) { sel = +tr.dataset.i; render(); } });
$('sess').addEventListener('change', (e) => { sid = e.target.value; sel = 0; render(); });
load();
</script></body></html>
