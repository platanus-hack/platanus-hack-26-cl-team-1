[project]
name = "server"
version = "0.1.0"
description = "Supervisor server: task library, session WebSocket, perception, controller, voice."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.uv.sources]
contracts = { path = "../contracts", editable = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
