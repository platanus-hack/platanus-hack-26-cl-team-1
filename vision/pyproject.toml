[project]
name = "circuito-vision"
version = "0.1.0"
description = "Modo Armado: servidor de visión (YOLO + VLM + voz) que guía el armado real del circuito"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=1.26",
  "opencv-contrib-python-headless>=4.10",
  "pillow>=10",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Only on the GPU server (uv sync --extra gpu). CI and laptops run without these.
gpu = [
  "ultralytics>=8.3",
  "kokoro>=0.9",
  "misaki[en]>=0.9",
  "espeakng-loader>=0.2",
  "phonemizer-fork>=3.3",
  "soundfile>=0.12",
  "openai>=1.50",
  # YOLO-World text encoder (ultralytics would pip-install it at runtime; uv venvs have no pip)
  "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
