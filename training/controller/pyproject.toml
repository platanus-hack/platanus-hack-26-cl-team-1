[project]
name = "ctrl-training"
version = "0.1.0"
description = "Learned controller: training from simulator trajectories, export for the server, evaluation."
requires-python = ">=3.12"
dependencies = ["contracts", "symsim", "numpy>=2", "torch>=2.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
contracts = { path = "../../contracts", editable = true }
symsim = { path = "../../sim/symbolic", editable = true }

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
