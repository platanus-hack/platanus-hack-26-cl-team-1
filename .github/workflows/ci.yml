name: CI

# Every job is listed in `ci-ok.needs`; `CI OK` is the one check to require on
# main. Adding a job (web, server, …) only means adding it there. D-006.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  tooling:
    name: CI tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Unit tests for scripts/ci
        run: python3 -I -m unittest discover -s scripts/ci/tests -t . -v

  contracts:
    name: Contracts (ruff, pytest, schemas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -ra
      - name: Committed JSON Schemas match the models
        run: uv run python -m contracts.export --check

  server:
    name: Server (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -ra

  symsim:
    name: Symbolic simulator (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sim/symbolic
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -ra

  training-lint:
    # Lint only: the training tests need torch, kept out of CI (the server job tests the committed weights).
    name: Controller training (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: training/controller
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.8.6 check .
      - run: uvx ruff@0.8.6 format --check .

  web:
    name: Web (types, tsc, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated TS types match the schemas
        run: pnpm check:types
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The one required check. It never has a job-level condition beyond always(),
  # because GitHub counts a skipped job as passing.
  ci-ok:
    name: CI OK
    if: always()
    needs: [workflow-lint, tooling, contracts, server, symsim, training-lint, web]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -c 'map_values(.result)'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
