name: CI

# Pull requests and feature branches run CI here; main runs it through cd.yml (workflow_call)
# so a push to main is tested once and deployed only if it passes.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# When called from cd.yml, github.workflow is "CD", so this never collides with the caller's group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python deps
        run: uv sync --frozen --python 3.11

      # arduino-cli + the Uno core so the real compile integration tests run (ESP32 stays opt-in: RUN_SLOW).
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.4.1"

      - name: Cache Arduino cores
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-avr-1.8.7-${{ runner.os }}

      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.7
          arduino-cli lib install Servo

      - name: Run tests
        run: uv run pytest -q -ra

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b --noEmit

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm exec vite build

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          tags: circuito-vivo-${{ matrix.image }}:ci
          push: false
          load: ${{ matrix.image != 'worker' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke test (api)
        if: matrix.image == 'api'
        run: |
          docker run -d --name api -p 8000:8000 -e REDIS_URL=redis://127.0.0.1:1/0 circuito-vivo-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api; exit 1

      # Renders the nginx template with Render-style env (PORT, API_HOSTPORT) and checks it boots
      # without the API being reachable, serves the SPA and answers the health check.
      - name: Smoke test (web)
        if: matrix.image == 'web'
        run: |
          docker run -d --name web -p 8080:10000 -e PORT=10000 -e API_HOSTPORT=circuito-vivo-api:8000 circuito-vivo-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<div id="root"'
          curl -fsS http://127.0.0.1:8080/some/spa/route | grep -qi '<div id="root"'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)
          test "$code" = 502 || { echo "expected 502 from an unreachable API, got $code"; docker logs web; exit 1; }
